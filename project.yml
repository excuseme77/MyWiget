name: Rock
options:
  bundleIdPrefix: com.rockpet
  deploymentTarget:
    iOS: "17.0"

packages:
  ClockHandKit:
    url: https://github.com/giljihun/ClockHandKit
    from: 0.1.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Rock:
    type: application
    platform: iOS
    sources:
      - RockApp.swift
    info:
      path: AppInfo.plist
      properties:
        CFBundleDisplayName: Камень
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockpet.app
    dependencies:
      - target: RockWidgetExtension

  RockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - RockWidget.swift
      - RockWidgetBundle.swift
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Камень
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rockpet.app.widget
    dependencies:
      - package: ClockHandKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Rock:
    build:
      targets:
        Rock: all
        RockWidgetExtension: all
